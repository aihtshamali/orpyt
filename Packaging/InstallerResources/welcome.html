<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Welcome to Orpyt</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      margin: 36px;
      color: #1f2937;
      background: linear-gradient(180deg, #f8fbff 0%, #eef5ff 100%);
    }
    h1 {
      font-size: 32px;
      margin: 0 0 10px;
    }
    p {
      font-size: 15px;
      line-height: 1.55;
      max-width: 620px;
      margin: 0 0 14px;
    }
    .eyebrow {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.08em;
      font-weight: 700;
      text-transform: uppercase;
      color: #1d4ed8;
      background: rgba(37, 99, 235, 0.09);
      margin-bottom: 18px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }
    .brand img {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.18);
    }
  </style>
</head>
<body>
  <div class="eyebrow">Orpyt Installer</div>
  <div class="brand">
    <img src="logo.png" alt="Orpyt" />
  </div>
  <h1>Install Orpyt</h1>
  <p>Orpyt is a native macOS menu bar clock built for people who work across time zones.</p>
  <p>This installer places <strong>Orpyt.app</strong> in your <strong>Applications</strong> folder so it behaves like a normal Mac app from first launch.</p>
</body>
</html>
