name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Import certificates
        env:
          P12_BASE64: ${{ secrets.CERTIFICATES_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$P12_BASE64" | base64 --decode -o $RUNNER_TEMP/certs.p12
          security import $RUNNER_TEMP/certs.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          # Install provisioning profile if provided (needed for WeatherKit with Developer ID)
          if [[ -n "$PROVISIONING_PROFILE_BASE64" ]]; then
            PP_PATH="$RUNNER_TEMP/orpyt.provisionprofile"
            echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
            echo "ORPYT_PROVISIONING_PROFILE=$PP_PATH" >> "$GITHUB_ENV"
          fi

      - name: Store notarization credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "orpyt-ci" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD"

      - name: Build, sign, notarize, generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          ORPYT_RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Orpyt Release Bot"
          git config --global user.email "release@orpyt.app"
          ORPYT_NOTARY_PROFILE="orpyt-ci" ./release.sh

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          APP="dist/release/Orpyt.app"
          PKG="dist/release/Orpyt.pkg"
          ZIP="dist/release/Orpyt.zip"

          echo "=== Code signature ==="
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "=== Gatekeeper assessment (app) ==="
          spctl --assess --type exec --verbose "$APP"

          echo "=== Gatekeeper assessment (pkg) ==="
          spctl --assess --type install --verbose "$PKG"

          echo "=== Entitlements present ==="
          codesign -d --entitlements :- "$APP" | grep -q "weatherkit" \
            && echo "WeatherKit entitlement: OK" \
            || echo "WARNING: WeatherKit entitlement missing"

          echo "=== Executable is runnable ==="
          EXEC=$(defaults read "$(pwd)/$APP/Contents/Info.plist" CFBundleExecutable)
          test -x "$APP/Contents/MacOS/$EXEC" \
            && echo "Executable $EXEC: OK" \
            || { echo "ERROR: Executable $EXEC not found or not executable"; exit 1; }

          echo "=== ZIP integrity ==="
          ditto -x -k "$ZIP" /tmp/orpyt-zip-check 2>&1 && echo "ZIP: OK"
          codesign --verify --deep --strict /tmp/orpyt-zip-check/Orpyt.app \
            && echo "ZIP app signature: OK" \
            || { echo "ERROR: ZIP app signature invalid"; exit 1; }

          echo "=== PKG integrity ==="
          pkgutil --check-signature "$PKG"

          echo "All checks passed."

      - name: Get version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Orpyt v${{ steps.version.outputs.version }}
          files: |
            dist/release/Orpyt.dmg
            dist/release/Orpyt.pkg
            dist/release/Orpyt.zip
          body: |
            ## Install

            **Recommended:** Download **Orpyt.dmg**, open it, drag Orpyt to Applications. Then double-click it from Applications to launch.

            > **If you see "can't be opened"** after installing: right-click Orpyt in Applications → Open → Open. This only happens once.

            Also available as **Orpyt.pkg** (installer) or **Orpyt.zip** (manual drag).

            ## Requirements
            - macOS 13.0 Ventura or later
